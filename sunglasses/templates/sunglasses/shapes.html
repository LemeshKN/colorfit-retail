{% extends "advisor/base.html" %}{% load i18n static %}
{% block title %}{% trans "Pick a face shape" %}{% endblock %}
{% block content %}
<a class="btn mb-4 min-h-12" href="{% url 'sunglasses:intro' shop_slug=shop.slug %}">&larr; {% trans "Back" %}</a>
<h1 class="mb-4 text-2xl font-bold">{% trans "Pick a face shape" %}</h1>
<ul class="grid grid-cols-2 gap-3">
  {% for shape in shapes %}
  <li>
    <a class="flex min-h-40 flex-col items-center justify-center gap-2 rounded-box border-2 border-base-content/60 bg-base-100 p-3 text-lg font-semibold" href="{% url 'sunglasses:shape_detail' shop_slug=shop.slug shape_slug=shape.slug %}">
      <img src="{% static 'img/shapes/'|add:shape.slug|add:'.svg' %}" alt="" width="96" height="120">
      <span>{{ shape.name }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
