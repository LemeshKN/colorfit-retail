{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ColorFit{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-base-100 text-base-content">
  <header class="navbar bg-base-200 px-4">
    <a class="flex-1 text-xl font-bold" href="{% url 'advisor:find_shop' %}">ColorFit</a>
    <form action="{% url 'set_language' %}" method="post" class="flex gap-2">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" name="language" value="en" class="btn btn-sm">English</button>
      <button type="submit" name="language" value="hi" class="btn btn-sm">हिन्दी</button>
    </form>
  </header>
  <main class="mx-auto w-full max-w-md p-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto w-full max-w-md p-4 text-sm">
    {% trans "All advice here is a styling suggestion. Colors on your screen vary by phone and brightness." %}
  </footer>
</body>
</html>
