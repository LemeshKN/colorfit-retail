{% extends "advisor/base.html" %}{% load i18n %}
{% block title %}{{ garment.name }}{% endblock %}
{% block content %}
<a class="btn btn-outline btn-sm" href="{% url 'advisor:garments' shop_slug=shop.slug %}">&larr; {% trans "Garments" %}</a>
<h1 class="my-3 text-2xl font-bold">{{ garment.name }}: {% trans "pick a color family" %}</h1>
<div class="grid grid-cols-2 gap-2 min-[360px]:grid-cols-3">
  {% for family in families %}
  <a class="card block h-full border-2 border-base-content/40 bg-base-100 p-1.5" href="{% url 'advisor:shades' shop_slug=shop.slug garment_slug=garment.slug family_slug=family.slug %}">
    <span class="block h-14 w-full rounded-lg border-2 border-base-content/30" style="background-color: {{ family.sample_hex|default:'#cccccc' }}"></span>
    <span class="mt-1 block break-words text-base font-semibold">{{ family.name }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
