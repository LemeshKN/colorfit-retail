{% extends "advisor/base.html" %}{% load i18n %}
{% block title %}{% trans "Choose a garment" %}{% endblock %}
{% block content %}
<h1 class="mb-4 text-2xl font-bold">{% trans "What are you looking for?" %}</h1>
<ul class="space-y-3">
  {% for garment in garments %}
  <li>
    <a class="btn btn-lg min-h-16 w-full justify-between border-2 border-base-content/40 bg-base-100 text-xl" href="{% url 'advisor:colors' shop_slug=shop.slug garment_slug=garment.slug %}">
      <span>{{ garment.name }}</span><span aria-hidden="true">&rarr;</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
