{% extends "advisor/base.html" %}{% load i18n %}
{% block title %}{{ shade.name }}{% endblock %}
{% block content %}
<a class="btn btn-outline btn-sm" href="{% url 'advisor:shades' shop_slug=shop.slug garment_slug=garment.slug family_slug=shade.family.slug %}">&larr; {{ shade.family.name }}</a>
<div class="my-3 flex items-center gap-3">
  <div class="h-14 w-14 shrink-0 rounded" style="background-color: {{ shade.hex }}"></div>
  <h1 class="text-2xl font-bold">{{ shade.name }}</h1>
</div>
<p class="mb-3">{% trans "Pick a bottom-wear type." %}</p>
<div class="space-y-3">
  {% for bottom in bottoms %}
  <a class="btn btn-lg w-full" href="{% url 'advisor:pairing' shop_slug=shop.slug garment_slug=garment.slug shade_id=shade.pk bottom_slug=bottom.slug %}">{{ bottom.name }}</a>
  {% endfor %}
</div>
{% endblock %}
